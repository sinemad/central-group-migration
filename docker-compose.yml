services:
  central-migration:
    build:
      context: .
      dockerfile: Dockerfile
    image: central-group-migration:latest
    container_name: central-migration
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Default: exports and backups are stored alongside the project directory.
      # Works on Linux, macOS, and Windows without any configuration.
      #
      # Linux users running on a remote server: set EXPORT_HOME in .env to
      # redirect data to your home directory, e.g.:
      #   EXPORT_HOME=/home/dan
      # macOS / Windows (Docker Desktop): leave EXPORT_HOME unset — Docker
      # Desktop handles bind-mount permissions automatically.
      - ${EXPORT_HOME:-./exports}:/app/exports
      - ${BACKUP_HOME:-./backups}:/app/backups
    restart: unless-stopped
    environment:
      # Optional: override gunicorn args without rebuilding the image
      - GUNICORN_CMD_ARGS=--bind=0.0.0.0:8000 --workers=1 --threads=8 --timeout=120 --keep-alive=5 --access-logfile=- --error-logfile=-
      # Match the container user to the host user who owns the export directory.
      # Run `id` on the Linux host to find your uid/gid. Required when the
      # export path is inside your home directory.
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
      # Export directory inside the container. Must match the right side of the
      # volume mount above. Uncomment and adjust if using a custom mount path.
      # - EXPORT_DIR=/data/central-exports
      # Backup directory inside the container.
      # - BACKUP_DIR=/data/central-backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
